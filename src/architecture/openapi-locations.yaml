openapi: 3.0.3
info:
  title: Locations API
  description: Synchronous HTTP API for managing venue locations and their seat layouts in the Event Ticket Booking System.
  version: 1.0.0

servers:
  - url: http://localhost:5000
    description: Local development

tags:
  - name: Locations
    description: Venue halls and location seat layout management

paths:
  /api/locations:
    get:
      tags: [Locations]
      summary: Get all locations
      description: Returns all venue locations with their configured seats.
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"

    post:
      tags: [Locations]
      summary: Create a location
      description: Creates a new venue location. This operation is restricted to Admin users.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationRequest"
            example:
              name: "Cinema City: Hall 1"
              address: "Kyiv, Ocean Plaza"
      responses:
        "201":
          description: Location created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          description: Invalid request body
        "401":
          description: Unauthorized
        "403":
          description: Forbidden. User does not have Admin role.

  /api/locations/{locationId}/seats:
    post:
      tags: [Locations]
      summary: Add seats to a location
      description: Adds one or more seats to an existing location seat layout. This operation is restricted to Admin users.
      security:
        - BearerAuth: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "e1a5323e-647d-4c3e-86e4-4458f3f89001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CreateSeatRequest"
            example:
              - row: "A"
                number: 1
              - row: "A"
                number: 2
      responses:
        "200":
          description: Seats added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "Seats successfully added to location e1a5323e-647d-4c3e-86e4-4458f3f89001"
        "400":
          description: Invalid request body
        "401":
          description: Unauthorized
        "403":
          description: Forbidden. User does not have Admin role.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateLocationRequest:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          example: "Cinema City: Hall 1"
        address:
          type: string
          example: "Kyiv, Ocean Plaza"

    CreateSeatRequest:
      type: object
      required: [row, number]
      properties:
        row:
          type: string
          example: "A"
        number:
          type: integer
          example: 12

    Location:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "e1a5323e-647d-4c3e-86e4-4458f3f89001"
        name:
          type: string
          example: "Cinema City: Hall 1"
        address:
          type: string
          example: "Kyiv, Ocean Plaza"
        seats:
          type: array
          items:
            $ref: "#/components/schemas/Seat"

    Seat:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "b1c2d3e4-0000-0000-0000-000000000002"
        locationId:
          type: string
          format: uuid
          example: "e1a5323e-647d-4c3e-86e4-4458f3f89001"
        row:
          type: string
          example: "A"
        number:
          type: integer
          example: 12
        status:
          type: string
          enum: [Available, Reserved, Paid]
          example: "Available"

    MessageResponse:
      type: object
      properties:
        message:
          type: string
